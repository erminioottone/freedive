<script>
'use strict';

const { useState, useEffect, useRef, useCallback, useMemo } = React;
const h = React.createElement;

// ─── Constants ────────────────────────────────────────────────────────────────

const DB_NAME = 'ApneaTrainerDB';
const DB_VERSION = 1;
const STORE_CONFIG = 'config';
const STORE_SESSION = 'session';
const STORE_HISTORY = 'history';

const SESSION_MAX_AGE_MS = 24 * 60 * 60 * 1000;
const AUTOSAVE_INTERVAL_MS = 10_000;
const TIMER_TICK_MS = 250;
const HISTORY_LIMIT = 15;

// ─── IndexedDB ────────────────────────────────────────────────────────────────

let dbPromise = null;

const openDB = () => {
    if (dbPromise) return dbPromise;

    dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);

        req.onerror = () => {
            dbPromise = null;
            reject(req.error);
        };

        req.onupgradeneeded = (event) => {
            const db = event.target.result;

            if (!db.objectStoreNames.contains(STORE_CONFIG)) {
                db.createObjectStore(STORE_CONFIG, { keyPath: 'id' });
            }

            if (!db.objectStoreNames.contains(STORE_SESSION)) {
                db.createObjectStore(STORE_SESSION, { keyPath: 'id' });
            }

            if (!db.objectStoreNames.contains(STORE_HISTORY)) {
                const historyStore = db.createObjectStore(STORE_HISTORY, {
                    keyPath: 'id',
                    autoIncrement: true,
                });
                historyStore.createIndex('timestamp', 'timestamp', { unique: false });
            }
        };

        req.onsuccess = () => {
            const db = req.result;

            db.onversionchange = () => {
                db.close();
                dbPromise = null;
            };

            resolve(db);
        };
    });

    return dbPromise;
};

const saveData = async (store, data) => {
    try {
        const db = await openDB();
        const tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).put(data);

        return await new Promise((resolve, reject) => {
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => reject(tx.error);
            tx.onabort = () => reject(tx.error || new Error('IndexedDB transaction aborted'));
        });
    } catch (error) {
        console.error('saveData:', error);
        return false;
    }
};

const loadData = async (store, id) => {
    try {
        const db = await openDB();
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).get(id);

        return await new Promise((resolve, reject) => {
            req.onsuccess = () => resolve(req.result ?? null);
            req.onerror = () => reject(req.error);
        });
    } catch (error) {
        console.error('loadData:', error);
        return null;
    }
};

const deleteData = async (store, id) => {
    try {
        const db = await openDB();
        const tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).delete(id);

        return await new Promise((resolve, reject) => {
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => reject(tx.error);
            tx.onabort = () => reject(tx.error || new Error('IndexedDB transaction aborted'));
        });
    } catch (error) {
        console.error('deleteData:', error);
        return false;
    }
};

const loadHistory = async (limit = HISTORY_LIMIT) => {
    try {
        const db = await openDB();
        const tx = db.transaction(STORE_HISTORY, 'readonly');
        const index = tx.objectStore(STORE_HISTORY).index('timestamp');
        const req = index.openCursor(null, 'prev');

        return await new Promise((resolve, reject) => {
            const rows = [];

            req.onsuccess = (event) => {
                const cursor = event.target.result;

                if (!cursor || rows.length >= limit) {
                    resolve(rows);
                    return;
                }

                rows.push(cursor.value);
                cursor.continue();
            };

            req.onerror = () => reject(req.error);
        });
    } catch (error) {
        console.error('loadHistory:', error);
        return [];
    }
};

const saveHistory = async (data) => {
    try {
        const db = await openDB();
        const tx = db.transaction(STORE_HISTORY, 'readwrite');
        tx.objectStore(STORE_HISTORY).add({ ...data, timestamp: Date.now() });

        return await new Promise((resolve, reject) => {
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => reject(tx.error);
            tx.onabort = () => reject(tx.error || new Error('IndexedDB transaction aborted'));
        });
    } catch (error) {
        console.error('saveHistory:', error);
        return false;
    }
};

// ─── Utilities ────────────────────────────────────────────────────────────────

const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

const toSafeInteger = (value, fallback = 0) => {
    const parsed = Number.parseInt(value, 10);
    return Number.isFinite(parsed) ? parsed : fallback;
};

const formatTime = (seconds) => {
    const safeSeconds = Math.max(0, Math.round(seconds));
    const mins = Math.floor(safeSeconds / 60).toString().padStart(2, '0');
    const secs = (safeSeconds % 60).toString().padStart(2, '0');
    return `${mins}:${secs}`;
};

const roundTime = (seconds) => {
    const safe = Math.max(0, seconds);
    if (safe <= 60) return Math.round(safe / 5) * 5;
    if (safe <= 300) return Math.round(safe / 15) * 15;
    return Math.round(safe / 30) * 30;
};

const isFreshSession = (session) =>
    Boolean(
        session?.timestamp &&
        Date.now() - session.timestamp >= 0 &&
        Date.now() - session.timestamp < SESSION_MAX_AGE_MS
    );

// CO₂: fixed breath hold per week, recovery decreases each rep.
const generateCO2Tables = (initialBH, initialRecovery, weeks = 6) => {
    const tables = {};

    for (let week = 1; week <= weeks; week += 1) {
        const weekBH = roundTime(
            initialBH + Math.floor(initialBH * 0.3) * (week - 1)
        );

        const baseRecovery = roundTime(
            Math.max(
                30,
                initialRecovery - Math.floor(initialRecovery * 0.15) * (week - 1)
            )
        );

        tables[`Week ${week}`] = Array.from({ length: 8 }, (_, rep) => ({
            bh: weekBH,
            rb: roundTime(
                Math.max(15, baseRecovery - Math.floor(baseRecovery * 0.05 * rep))
            ),
        }));
    }

    return tables;
};

// O₂: breath hold increases each rep, recovery is fixed per week.
const generateO2Tables = (initialBH, recovery, weeks = 6) => {
    const tables = {};

    for (let week = 1; week <= weeks; week += 1) {
        const weekStartBH = roundTime(
            initialBH + Math.floor(initialBH * 0.15) * (week - 1)
        );

        const repIncrement = Math.max(5, roundTime(weekStartBH * 0.1));

        tables[`Week ${week}`] = Array.from({ length: 8 }, (_, rep) => ({
            bh: roundTime(weekStartBH + repIncrement * rep),
            rb: recovery,
        }));
    }

    return tables;
};

// ─── Audio hook ───────────────────────────────────────────────────────────────

const useAudio = () => {
    const ctxRef = useRef(null);

    const ensureContext = useCallback(async () => {
        if (!ctxRef.current) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return null;
            ctxRef.current = new AudioContextClass();
        }

        if (ctxRef.current.state === 'suspended') {
            try {
                await ctxRef.current.resume();
            } catch (_) {
                // Audio may remain blocked until a user gesture.
            }
        }

        return ctxRef.current;
    }, []);

    const playSound = useCallback(async (type) => {
        const ctx = await ensureContext();
        if (!ctx) return;

        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        oscillator.connect(gain);
        gain.connect(ctx.destination);

        const time = ctx.currentTime;
        const definitions = {
            start: () => {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(523.25, time);
                gain.gain.setValueAtTime(0.5, time);
                gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.5);
                return 0.52;
            },
            end: () => {
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(880, time);
                gain.gain.setValueAtTime(0.5, time);
                gain.gain.exponentialRampToValueAtTime(0.0001, time + 1.0);
                return 1.02;
            },
            rep: () => {
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(440, time);
                gain.gain.setValueAtTime(0.35, time);
                gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.25);
                return 0.27;
            },
            prep: () => {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(660, time);
                gain.gain.setValueAtTime(0.3, time);
                gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.4);
                return 0.42;
            },
        };

        const duration = (definitions[type] || definitions.start)();
        oscillator.start(time);
        oscillator.stop(time + duration);
    }, [ensureContext]);

    return { playSound, ensureContext };
};

// ─── Wake Lock hook ───────────────────────────────────────────────────────────

const useWakeLock = () => {
    const lockRef = useRef(null);

    const requestWakeLock = useCallback(async () => {
        if (!('wakeLock' in navigator)) return false;

        try {
            lockRef.current = await navigator.wakeLock.request('screen');
            return true;
        } catch (error) {
            console.warn('Wake lock failed:', error?.message || error);
            return false;
        }
    }, []);

    const releaseWakeLock = useCallback(async () => {
        if (!lockRef.current) return;

        try {
            await lockRef.current.release();
        } catch (_) {
            // Ignore release failures.
        } finally {
            lockRef.current = null;
        }
    }, []);

    return { requestWakeLock, releaseWakeLock };
};

    return h(
        'div',
        {
            className: 'relative flex flex-col items-center justify-center bg-gray-900 rounded-full w-64 h-64 sm:w-80 sm:h-80 md:w-96 md:h-96 mx-auto my-6',
            role: 'status',
            'aria-live': 'polite',
        },
        h(
            'svg',
            {
                className: 'absolute inset-0 w-full h-full',
                viewBox: '0 0 200 200',
                style: { transform: 'rotate(-90deg)' },
                'aria-hidden': 'true',
            },
            h('circle', {
                cx: 100,
                cy: 100,
                r: 90,
                fill: 'transparent',
                stroke: '#1f2937',
                strokeWidth: 8,
            }),
            h('circle', {
                cx: 100,
                cy: 100,
                r: 90,
                fill: 'transparent',
                stroke: meta.color,
                strokeWidth: 8,
                strokeDasharray: circumference,
                strokeDashoffset: circumference * (1 - progress),
                strokeLinecap: 'round',
                style: {
                    transition: 'stroke-dashoffset 0.25s linear, stroke 0.4s ease',

            })

            'div',

                'div',
                { className: `text-lg sm:text-xl font-medium mt-2 tracking-wide ${meta.textClass}` },
                meta.label
            ),
            h(
                'div',
                { className: 'text-sm text-gray-500 mt-1' },
                phase === 'PREP' ? 'Relax and breathe' : `Rep ${rep} / ${totalReps}`
            )
        )
    );
};

// ─── SetupScreen ──────────────────────────────────────────────────────────────

const SetupScreen = ({ mode, onStart, onBack, savedConfig, hasSavedSession }) => {
    const metadata = MODE[mode];

    const [bhMinutes, setBhMinutes] = useState(savedConfig?.bhMinutes ?? 1);
    const [bhSeconds, setBhSeconds] = useState(savedConfig?.bhSeconds ?? 30);
    const [recoveryMinutes, setRecoveryMinutes] = useState(savedConfig?.recoveryMinutes ?? 2);
    const [recoverySeconds, setRecoverySeconds] = useState(savedConfig?.recoverySeconds ?? 0);
    const [prepMinutes, setPrepMinutes] = useState(savedConfig?.prepMinutes ?? 2);
    const [prepSeconds, setPrepSeconds] = useState(savedConfig?.prepSeconds ?? 0);
    const [weeks, setWeeks] = useState(clamp(savedConfig?.weeks ?? 6, 4, 10));
    const [selectedWeek, setSelectedWeek] = useState(
        clamp(savedConfig?.selectedWeek ?? 1, 1, savedConfig?.weeks ?? 6)
    );
    const [showHistory, setShowHistory] = useState(false);
    const [historyLoaded, setHistoryLoaded] = useState(false);
    const [history, setHistory] = useState([]);

    useEffect(() => {
        if (selectedWeek > weeks) setSelectedWeek(weeks);
    }, [weeks, selectedWeek]);

    const setClampedMinutes = (setter) => (value) =>
        setter(clamp(toSafeInteger(value), 0, 10));

    const setClampedSeconds = (setter) => (value) =>
        setter(clamp(toSafeInteger(value), 0, 59));

    const handleStart = async () => {
        const totalBH = bhMinutes * 60 + bhSeconds;
        const totalRecovery = recoveryMinutes * 60 + recoverySeconds;
        const totalPrep = prepMinutes * 60 + prepSeconds;
        const safeSelectedWeek = clamp(selectedWeek, 1, weeks);

        if (totalBH <= 0 || totalRecovery <= 0) return;

        const config = {
            mode,
            breathHold: totalBH,
            recovery: totalRecovery,
            prepTime: totalPrep,
            weeks,
            selectedWeek: safeSelectedWeek,
            bhMinutes,
            bhSeconds,
            recoveryMinutes,
            recoverySeconds,
            prepMinutes,
            prepSeconds,
        };

        await saveData(STORE_CONFIG, { id: 'current', ...config });
        onStart(config, false);
    };

    const handleResume = async () => {
        const config = await loadData(STORE_CONFIG, 'current');
        if (config) onStart(config, true);
    };

    const handleToggleHistory = async () => {
        const next = !showHistory;
        setShowHistory(next);

        if (next && !historyLoaded) {
            const rows = await loadHistory(HISTORY_LIMIT);
            setHistory(rows);
            setHistoryLoaded(true);
        }
    };

    const TimeInput = ({ label, hint, mins, secs, onMins, onSecs }) =>
        h(
            'div',
            { className: `bg-gray-800 rounded-lg p-4 border ${metadata.accentBorder} border-opacity-40` },
            h(
                'div',
                { className: 'flex items-baseline justify-between mb-3 gap-3' },
                h('label', { className: 'text-sm font-medium text-gray-300' }, label),
                hint && h('span', { className: 'text-xs text-gray-500 italic text-right' }, hint)
            ),
            h(
                'div',
                { className: 'flex items-center justify-center space-x-3' },
                h('input', {
                    type: 'number',
                    inputMode: 'numeric',
                    min: 0,
                    max: 10,
                    value: mins,
                    onChange: (event) => onMins(event.target.value),

                        },

                        )
                    )
                )
            ),

                    onClick: handleStart,

                },

            ),

                ),

// ─── TrainingScreen ───────────────────────────────────────────────────────────

const TrainingScreen = ({ config, onExit, resumeSession }) => {
    const metadata = MODE[config.mode] || MODE.co2;
    const prepTime = config.prepTime ?? 120;

    const tables = useMemo(
        () => metadata.generator(config.breathHold, config.recovery, config.weeks),
        [metadata, config.breathHold, config.recovery, config.weeks]
    );

    const validWeekNames = Object.keys(tables);
    const fallbackWeek = `Week ${clamp(config.selectedWeek ?? 1, 1, validWeekNames.length)}`;
    const resumedWeek = resumeSession?.selectedTable;
    const initialWeek = tables[resumedWeek] ? resumedWeek : fallbackWeek;

    const [selectedTable, setSelectedTable] = useState(initialWeek);
    const tableData = tables[selectedTable] || tables[validWeekNames[0]];
    const totalReps = tableData.length;

    const initialPhase = resumeSession?.currentPhase ?? (prepTime > 0 ? 'PREP' : 'BH');
    const initialTime = resumeSession?.timeRemaining ?? (prepTime > 0 ? prepTime : tableData[0].bh);
    const initialPhaseDuration = resumeSession?.initialDuration ?? initialTime;
    const initialRep = clamp(resumeSession?.currentRep ?? 0, 0, totalReps - 1);

    const [isRunning, setIsRunning] = useState(false);
    const [currentRep, setCurrentRep] = useState(initialRep);
    const [currentPhase, setCurrentPhase] = useState(initialPhase);
    const [timeRemaining, setTimeRemaining] = useState(Math.max(0, initialTime));
    const [initialDuration, setInitialDuration] = useState(Math.max(0, initialPhaseDuration));
    const [sessionFinished, setSessionFinished] = useState(false);

    const repRef = useRef(currentRep);
    const phaseRef = useRef(currentPhase);
    const timeRef = useRef(timeRemaining);
    const durationRef = useRef(initialDuration);
    const runningRef = useRef(false);
    const finishedRef = useRef(false);
    const tableRef = useRef(selectedTable);
    const deadlineRef = useRef(null);
    const intervalRef = useRef(null);
    const autosaveRef = useRef(null);
    const firstMount = useRef(true);
    const transitionLockRef = useRef(false);

    const { playSound, ensureContext } = useAudio();
    const { requestWakeLock, releaseWakeLock } = useWakeLock();

    useEffect(() => { repRef.current = currentRep; }, [currentRep]);
    useEffect(() => { phaseRef.current = currentPhase; }, [currentPhase]);
    useEffect(() => { timeRef.current = timeRemaining; }, [timeRemaining]);
    useEffect(() => { durationRef.current = initialDuration; }, [initialDuration]);
    useEffect(() => { runningRef.current = isRunning; }, [isRunning]);
    useEffect(() => { finishedRef.current = sessionFinished; }, [sessionFinished]);
    useEffect(() => { tableRef.current = selectedTable; }, [selectedTable]);

    const persistSession = useCallback(async () => {
        if (finishedRef.current) return;

        await saveData(STORE_SESSION, {
            id: 'current',
            selectedTable: tableRef.current,
            currentRep: repRef.current,
            currentPhase: phaseRef.current,
            timeRemaining: timeRef.current,
            initialDuration: durationRef.current,
            timestamp: Date.now(),
        });
    }, []);

    const clearTimerInterval = useCallback(() => {
        if (intervalRef.current) {
            clearInterval(intervalRef.current);
            intervalRef.current = null;
        }
    }, []);

    const clearAutosaveInterval = useCallback(() => {
        if (autosaveRef.current) {
            clearInterval(autosaveRef.current);
            autosaveRef.current = null;
        }
    }, []);

    const stopRunning = useCallback(async ({ save = true } = {}) => {
        clearTimerInterval();
        clearAutosaveInterval();
        deadlineRef.current = null;
        runningRef.current = false;
        setIsRunning(false);
        await releaseWakeLock();
        if (save) await persistSession();
    }, [clearAutosaveInterval, clearTimerInterval, persistSession, releaseWakeLock]);

    const finishSession = useCallback(async () => {
        clearTimerInterval();
        clearAutosaveInterval();
        deadlineRef.current = null;
        runningRef.current = false;
        finishedRef.current = true;
        setIsRunning(false);
        setSessionFinished(true);
        await releaseWakeLock();
        await saveHistory({
            mode: config.mode,
            weekName: tableRef.current,
            totalReps,
            completed: true,
        });
        await deleteData(STORE_SESSION, 'current');
    }, [clearAutosaveInterval, clearTimerInterval, config.mode, releaseWakeLock, totalReps]);

    const applyPhase = useCallback((phase, rep, duration, soundType) => {
        if (soundType) playSound(soundType);

        phaseRef.current = phase;
        repRef.current = rep;
        timeRef.current = duration;
        durationRef.current = duration;

        setCurrentPhase(phase);
        setCurrentRep(rep);
        setTimeRemaining(duration);
        setInitialDuration(duration);

        deadlineRef.current = performance.now() + duration * 1000;
    }, [playSound]);

    const advancePhase = useCallback(async () => {
        if (transitionLockRef.current || finishedRef.current) return;
        transitionLockRef.current = true;

        try {
            const phase = phaseRef.current;
            const rep = repRef.current;

            if (phase === 'PREP') {
                applyPhase('BH', 0, tableData[0].bh, 'prep');
                await persistSession();
                return;
            }

            if (phase === 'BH') {
                applyPhase('RB', rep, tableData[rep].rb, 'end');
                await persistSession();
                return;
            }

            if (rep < totalReps - 1) {
                const nextRep = rep + 1;
                applyPhase('BH', nextRep, tableData[nextRep].bh, 'rep');
                await persistSession();
                return;
            }

            playSound('end');
            await finishSession();
        } finally {
            transitionLockRef.current = false;
        }
    }, [applyPhase, finishSession, persistSession, playSound, tableData, totalReps]);

    const tick = useCallback(() => {
        if (!runningRef.current || !deadlineRef.current || finishedRef.current) return;

        const remaining = Math.max(
            0,
            Math.ceil((deadlineRef.current - performance.now()) / 1000)
        );

        if (remaining !== timeRef.current) {
            timeRef.current = remaining;
            setTimeRemaining(remaining);
        }

        if (remaining === 0) {
            advancePhase();
        }
    }, [advancePhase]);

    // Timer interval. The displayed time is derived from a real deadline, not
    // from the number of interval callbacks, preventing normal callback drift.
    useEffect(() => {
        if (!isRunning || intervalRef.current) return undefined;

        intervalRef.current = setInterval(tick, TIMER_TICK_MS);

        return () => {
            clearTimerInterval();
        };
    }, [isRunning, tick, clearTimerInterval]);

    // Autosave only while actively running. Other state transitions save immediately.
    useEffect(() => {
        if (!isRunning || autosaveRef.current) return undefined;

        autosaveRef.current = setInterval(() => {
            persistSession();
        }, AUTOSAVE_INTERVAL_MS);

        return () => {
            clearAutosaveInterval();
        };
    }, [isRunning, persistSession, clearAutosaveInterval]);

    // iOS/Safari may throttle JavaScript when hidden. Pause + save instead of
    // allowing the training timer to silently become inaccurate.
    useEffect(() => {
        const handleVisibilityChange = () => {
            if (document.visibilityState === 'hidden' && runningRef.current) {
                stopRunning({ save: true });
            }
        };

        document.addEventListener('visibilitychange', handleVisibilityChange);
        return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
    }, [stopRunning]);

    // Reset when the selected week changes. Skip first mount so a resumed
    // session keeps its saved state.
    useEffect(() => {
        if (firstMount.current) {
            firstMount.current = false;
            return;
        }

        if (!tables[selectedTable]) return;

        clearTimerInterval();
        clearAutosaveInterval();
        releaseWakeLock();

        const startingPhase = prepTime > 0 ? 'PREP' : 'BH';
        const startingTime = prepTime > 0 ? prepTime : tables[selectedTable][0].bh;

        deadlineRef.current = null;
        runningRef.current = false;
        finishedRef.current = false;
        repRef.current = 0;
        phaseRef.current = startingPhase;
        timeRef.current = startingTime;
        durationRef.current = startingTime;

        setIsRunning(false);
        setCurrentRep(0);
        setCurrentPhase(startingPhase);
        setTimeRemaining(startingTime);
        setInitialDuration(startingTime);
        setSessionFinished(false);

        persistSession();
    }, [
        selectedTable,
        tables,
        prepTime,
        clearAutosaveInterval,
        clearTimerInterval,
        releaseWakeLock,
        persistSession,
    ]);

    // Save latest state before the training screen unmounts.
    useEffect(() => () => {
        clearTimerInterval();
        clearAutosaveInterval();
        releaseWakeLock();
        if (!finishedRef.current) persistSession();
    }, [clearAutosaveInterval, clearTimerInterval, persistSession, releaseWakeLock]);

    const handleStart = async () => {
        if (sessionFinished) return;

        await ensureContext().catch(() => {});
        await requestWakeLock();

        deadlineRef.current = performance.now() + timeRef.current * 1000;
        runningRef.current = true;
        setIsRunning(true);
        playSound('start');
    };

    const handleStop = async () => {
        await stopRunning({ save: true });
    };

    const handleReset = async () => {
        if (sessionFinished) return;

        await stopRunning({ save: false });

        const startingPhase = prepTime > 0 ? 'PREP' : 'BH';
        const startingTime = prepTime > 0 ? prepTime : tableData[0].bh;

        repRef.current = 0;
        phaseRef.current = startingPhase;
        timeRef.current = startingTime;
        durationRef.current = startingTime;
        finishedRef.current = false;

        setCurrentRep(0);
        setCurrentPhase(startingPhase);
        setTimeRemaining(startingTime);
        setInitialDuration(startingTime);
        setSessionFinished(false);

        await persistSession();
        playSound('end');
    };

    const handleExit = async () => {
        if (runningRef.current) {
            await stopRunning({ save: true });
        } else if (!finishedRef.current) {
            await persistSession();
        }
        onExit();
    };

    const progress = useMemo(() => {
        if (currentPhase === 'PREP') return 0;

        const totalSteps = totalReps * 2;
        const withinPhase = initialDuration > 0
            ? clamp((initialDuration - timeRemaining) / initialDuration, 0, 1)
            : 0;

        const completedSteps = currentRep * 2 +
            (currentPhase === 'BH' ? withinPhase : 1 + withinPhase);

        return clamp(completedSteps / totalSteps, 0, 1);
    }, [currentRep, currentPhase, timeRemaining, initialDuration, totalReps]);

    return h(
        'div',
        {
            className: 'safe-screen bg-black min-h-screen min-h-[100dvh] flex flex-col items-center justify-start text-white font-sans overflow-y-auto',
        },
        h(
            'div',
            { className: 'w-full max-w-2xl mx-auto py-1' },
            h(
                'div',
                { className: 'flex items-center justify-between mb-4' },
                h(
                    'button',
                    {
                        type: 'button',
                        onClick: handleExit,
                        className: 'text-gray-500 hover:text-white transition-colors text-sm sm:text-base',
                    },
                    '← Back'
                ),
                h(
                    'div',
                    { className: 'text-center' },
                    h('h1', { className: `text-xl sm:text-2xl font-bold ${metadata.accentText}` }, metadata.label),
                    h('p', { className: 'text-gray-500 text-xs' }, selectedTable)
                ),
                isRunning
                    ? h(
                        'div',
                        { className: 'flex items-center space-x-1 text-green-400 text-xs' },
                        h('div', { className: 'w-2 h-2 rounded-full bg-green-400 animate-pulse' }),
                        h('span', { className: 'hidden sm:inline' }, 'Screen on')
                    )
                    : h('div', { className: 'w-16', 'aria-hidden': 'true' })
            ),

            h(TimerDisplay, {
                time: timeRemaining,
                phase: currentPhase,
                rep: currentRep + 1,
                totalReps,
                initialDuration,
            }),

            h(
                'div',
                { className: 'my-4 px-2' },
                h(
                    'div',
                    { className: 'flex items-center justify-between mb-2 text-xs sm:text-sm text-gray-500' },
                    h('span', null, currentPhase === 'PREP' ? 'Preparing…' : 'Session Progress'),
                    h('span', null, `${Math.round(progress * 100)}%`)
                ),
                h(
                    'div',
                    { className: 'w-full h-3 bg-gray-800 rounded-full overflow-hidden border border-gray-700' },
                    h('div', {
                        className: 'h-full rounded-full transition-all duration-300 ease-linear',
                        style: {
                            width: `${progress * 100}%`,
                            background: 'linear-gradient(90deg,#06b6d4,#10b981)',
                        },
                    })
                )
            ),

            h(
                'div',
                { className: 'my-4' },
                h('label', { htmlFor: 'week-select', className: 'block text-sm font-medium text-gray-400 mb-2 text-center' }, 'Change Week'),
                h(
                    'select',
                    {
                        id: 'week-select',
                        value: selectedTable,
                        onChange: (event) => setSelectedTable(event.target.value),
                        disabled: isRunning,
                        className: 'block w-full max-w-xs mx-auto bg-gray-800 border border-gray-700 text-white text-base sm:text-lg rounded-lg p-2 sm:p-3 disabled:opacity-50',
                    },
                    validWeekNames.map((weekName) =>
                        h('option', { key: weekName, value: weekName }, weekName)
                    )
                )
            ),

            h(
                'div',
                { className: 'flex justify-center items-center space-x-3 sm:space-x-4 my-5' },
                !isRunning
                    ? h(
                        'button',
                        {
                            type: 'button',
                            onClick: handleStart,
                            disabled: sessionFinished,
                            className: `font-bold py-3 px-8 sm:py-4 sm:px-10 rounded-full text-xl sm:text-2xl shadow-lg transition-all ${sessionFinished ? 'bg-gray-700 text-gray-500 cursor-not-allowed' : 'bg-green-500 hover:bg-green-600 active:bg-green-700 text-white transform active:scale-95'}`,
                        },
                        'Start'
                    )
                    : h(
                        'button',
                        {
                            type: 'button',
                            onClick: handleStop,
                            className: 'bg-red-500 hover:bg-red-600 active:bg-red-700 text-white font-bold py-3 px-8 sm:py-4 sm:px-10 rounded-full text-xl sm:text-2xl shadow-lg transform active:scale-95 transition-all',
                        },
                        'Stop'
                    ),
                h(
                    'button',
                    {
                        type: 'button',
                        onClick: handleReset,
                        disabled: sessionFinished,
                        className: `font-bold py-3 px-8 sm:py-4 sm:px-10 rounded-full text-xl sm:text-2xl shadow-lg transition-all ${sessionFinished ? 'bg-gray-700 text-gray-500 cursor-not-allowed' : 'bg-gray-600 hover:bg-gray-500 active:bg-gray-700 transform active:scale-95'}`,
                    },
                    'Reset'
                )
            ),

            sessionFinished && h(
                'div',
                { className: 'my-4 p-4 bg-green-900/30 border border-green-700 rounded-lg text-center' },
                h('p', { className: 'text-green-300 text-lg font-semibold' }, 'Session Complete!'),
                h('p', { className: 'text-green-400 text-sm mt-2' }, 'Your progress has been saved.')
            ),

            h(
                'div',
                { className: 'mt-4 mb-4' },
                h(
                    'div',
                    { className: 'flex items-center justify-between mb-3 px-1' },
                    h('h2', { className: 'text-sm font-medium text-gray-500' }, 'Week Schedule'),
                    h(
                        'span',
                        { className: `text-xs ${metadata.accentText}` },
                        config.mode === 'co2' ? 'Fixed hold · ↓ recovery' : '↑ hold · Fixed recovery'
                    )
                ),
                h(
                    'div',
                    { className: 'overflow-x-auto rounded-lg border border-gray-800' },
                    h(
                        'table',
                        { className: 'w-full text-xs sm:text-sm border-collapse' },
                        h(
                            'thead',
                            { className: 'bg-gray-800/60' },
                            h(
                                'tr',
                                null,
                                h('th', { className: 'text-gray-500 font-medium py-2 text-left pl-3' }, 'Rep'),
                                h('th', { className: 'text-cyan-600 font-medium py-2 text-center' }, 'Hold'),
                                h('th', { className: 'text-orange-600 font-medium py-2 text-center' }, 'Recovery')
                            )
                        ),
                        h(
                            'tbody',
                            null,
                            tableData.map((row, index) =>
                                h(
                                    'tr',
                                    {
                                        key: index,
                                        className: `border-t border-gray-800/60 ${index === currentRep && currentPhase !== 'PREP' && !sessionFinished ? 'bg-gray-800/50' : ''}`,
                                    },
                                    h(
                                        'td',
                                        { className: 'py-2 pl-3 text-gray-400' },
                                        index === currentRep && currentPhase !== 'PREP' && !sessionFinished
                                            ? h('span', { className: 'inline-block w-1.5 h-1.5 rounded-full bg-cyan-400 mr-2 align-middle' })
                                            : null,
                                        `#${index + 1}`
                                    ),
                                    h('td', { className: 'py-2 text-center text-cyan-300 font-mono' }, formatTime(row.bh)),
                                    h('td', { className: 'py-2 text-center text-orange-300 font-mono' }, formatTime(row.rb))
                                )
                            )
                        )
                    )
                )
            ),

            h(
                'footer',
                { className: 'text-center mt-2 mb-5 text-gray-600 text-xs space-y-1' },
                h('p', null, 'Hold your breath during BREATH HOLD.'),
                h('p', null, 'Breathe normally during RECOVERY and Preparation.'),
                h('p', { className: `mt-1 ${metadata.accentText}` }, 'Progress saves automatically and when the app is paused.')
            )
        )
    );
};

// ─── App ──────────────────────────────────────────────────────────────────────

const App = () => {
    const [screen, setScreen] = useState('select');
    const [mode, setMode] = useState(null);
    const [trainingConfig, setTrainingConfig] = useState(null);
    const [savedConfig, setSavedConfig] = useState(null);
    const [savedSession, setSavedSession] = useState(null);
    const [hasSavedSession, setHasSavedSession] = useState(false);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
        let cancelled = false;

        (async () => {
            try {
                const [config, session] = await Promise.all([
                    loadData(STORE_CONFIG, 'current'),
                    loadData(STORE_SESSION, 'current'),
                ]);

                if (cancelled) return;

                if (config) setSavedConfig(config);

                if (isFreshSession(session)) {
                    setSavedSession(session);
                    setHasSavedSession(true);
                } else if (session) {
                    await deleteData(STORE_SESSION, 'current');
                }
            } finally {
                if (!cancelled) setLoading(false);
            }
        })();

        return () => {
            cancelled = true;
        };
    }, []);

    const handleSelectMode = useCallback((selectedMode) => {
        setMode(selectedMode);
        setScreen('setup');
    }, []);

    const handleStartTraining = useCallback(async (config, resume = false) => {
        setTrainingConfig(config);
        setSavedConfig({ id: 'current', ...config });

        if (!resume) {
            setSavedSession(null);
            setHasSavedSession(false);
            await deleteData(STORE_SESSION, 'current');
        }

        setScreen('training');
    }, []);

    const handleResume = useCallback(async () => {
        const [config, session] = await Promise.all([
            loadData(STORE_CONFIG, 'current'),
            loadData(STORE_SESSION, 'current'),
        ]);

        if (!config || !isFreshSession(session)) {
            setSavedSession(null);
            setHasSavedSession(false);
            if (session) await deleteData(STORE_SESSION, 'current');
            return;
        }

        setTrainingConfig(config);
        setSavedConfig(config);
        setSavedSession(session);
        setScreen('training');
    }, []);

    const handleExitToSelect = useCallback(async () => {
        const [session, config] = await Promise.all([
            loadData(STORE_SESSION, 'current'),
            loadData(STORE_CONFIG, 'current'),
        ]);

        if (config) setSavedConfig(config);

        if (isFreshSession(session)) {
            setSavedSession(session);
            setHasSavedSession(true);
        } else {
            setSavedSession(null);
            setHasSavedSession(false);
            if (session) await deleteData(STORE_SESSION, 'current');
        }

        setScreen('select');
    }, []);

    if (loading) {
        return h(
            'div',
            { className: 'safe-screen bg-black min-h-screen min-h-[100dvh] flex items-center justify-center text-white' },
            h(
                'div',
                { className: 'text-center' },
                h('div', { className: 'w-12 h-12 rounded-full border-4 border-gray-700 border-t-cyan-400 animate-spin mx-auto mb-4' }),
                h('p', { className: 'text-gray-500 text-lg' }, 'Loading…')
            )
        );
    }

    if (screen === 'training' && trainingConfig) {
        return h(TrainingScreen, {
            config: trainingConfig,
            onExit: handleExitToSelect,
            resumeSession: savedSession,
        });
    }

    if (screen === 'setup' && mode) {
        return h(SetupScreen, {
            mode,
            onStart: handleStartTraining,
            onBack: () => setScreen('select'),
            savedConfig: savedConfig?.mode === mode ? savedConfig : null,
            hasSavedSession: hasSavedSession && savedConfig?.mode === mode,
        });
    }

    return h(TypeSelectionScreen, {
        onSelectMode: handleSelectMode,
        hasSavedSession,
        savedConfig,
        onResume: handleResume,
    });
};

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
