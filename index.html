const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ─── IndexedDB ────────────────────────────────────────────────────────────────

const DB_NAME    = 'ApneaTrainerDB';
const DB_VERSION = 1;
const STORE_CONFIG  = 'config';
const STORE_SESSION = 'session';
const STORE_HISTORY = 'history';

const openDB = () => new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror   = () => reject(req.error);
    req.onsuccess = () => resolve(req.result);
    req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_CONFIG))
            db.createObjectStore(STORE_CONFIG, { keyPath: 'id' });
        if (!db.objectStoreNames.contains(STORE_SESSION))
            db.createObjectStore(STORE_SESSION, { keyPath: 'id' });
        if (!db.objectStoreNames.contains(STORE_HISTORY)) {
            const hs = db.createObjectStore(STORE_HISTORY, { keyPath: 'id', autoIncrement: true });
            hs.createIndex('timestamp', 'timestamp', { unique: false });
        }
    };
});

const saveData = async (store, data) => {
    try {
        const db = await openDB();
        const tx = db.transaction([store], 'readwrite');
        tx.objectStore(store).put(data);
        return new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    } catch (e) { console.error('saveData:', e); }
};

const loadData = async (store, id) => {
    try {
        const db  = await openDB();
        const tx  = db.transaction([store], 'readonly');
        const req = tx.objectStore(store).get(id);
        return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });
    } catch (e) { console.error('loadData:', e); return null; }
};

const deleteData = async (store, id) => {
    try {
        const db = await openDB();
        const tx = db.transaction([store], 'readwrite');
        tx.objectStore(store).delete(id);
        return new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    } catch (e) { console.error('deleteData:', e); }
};

const loadHistory = async () => {
    try {
        const db  = await openDB();
        const tx  = db.transaction([STORE_HISTORY], 'readonly');
        const req = tx.objectStore(STORE_HISTORY).index('timestamp').openCursor(null, 'prev');
        return new Promise((res, rej) => {
            const rows = [];
            req.onsuccess = (e) => { const c = e.target.result; if (c) { rows.push(c.value); c.continue(); } else res(rows); };
            req.onerror = () => rej(req.error);
        });
    } catch (e) { console.error('loadHistory:', e); return []; }
};

const saveHistory = async (data) => {
    try {
        const db = await openDB();
        const tx = db.transaction([STORE_HISTORY], 'readwrite');
        tx.objectStore(STORE_HISTORY).add({ ...data, timestamp: Date.now() });
        return new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    } catch (e) { console.error('saveHistory:', e); }
};

// ─── Utilities ────────────────────────────────────────────────────────────────

const formatTime = (s) =>
    `${Math.floor(s / 60).toString().padStart(2,'0')}:${(s % 60).toString().padStart(2,'0')}`;

const roundTime = (s) => {
    if (s <= 60)  return Math.round(s /  5) *  5;
    if (s <= 300) return Math.round(s / 15) * 15;
    return Math.round(s / 30) * 30;
};

// CO₂: fixed BH per week, recovery decreases each rep
const generateCO2Tables = (initialBH, initialRecovery, weeks = 6) => {
    const tables = {};
    for (let w = 1; w <= weeks; w++) {
        const weekBH  = roundTime(initialBH + Math.floor(initialBH * 0.3) * (w - 1));
        const baseRec = roundTime(Math.max(30, initialRecovery - Math.floor(initialRecovery * 0.15) * (w - 1)));
        tables[`Week ${w}`] = Array.from({ length: 8 }, (_, rep) => ({
            bh: weekBH,
            rb: roundTime(Math.max(15, baseRec - Math.floor(baseRec * 0.05 * rep)))
        }));
    }
    return tables;
};

// O₂: BH increases each rep, fixed recovery per week
const generateO2Tables = (initialBH, recovery, weeks = 6) => {
    const tables = {};
    for (let w = 1; w <= weeks; w++) {
        const weekStartBH  = roundTime(initialBH + Math.floor(initialBH * 0.15) * (w - 1));
        const repIncrement = Math.max(5, roundTime(weekStartBH * 0.1));
        tables[`Week ${w}`] = Array.from({ length: 8 }, (_, rep) => ({
            bh: roundTime(weekStartBH + repIncrement * rep),
            rb: recovery
        }));
    }
    return tables;
};

// ─── Audio hook ───────────────────────────────────────────────────────────────

const useAudio = () => {
    const ctxRef = useRef(null);

    const ensureContext = useCallback(async () => {
        if (!ctxRef.current) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return null;
            ctxRef.current = new Ctx();
        }
        if (ctxRef.current.state === 'suspended') await ctxRef.current.resume().catch(() => {});
        return ctxRef.current;
    }, []);

    const playSound = useCallback(async (type) => {
        const ctx = await ensureContext();
        if (!ctx) return;
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        const t = ctx.currentTime;
        const defs = {
            start: () => { osc.type='sine';     osc.frequency.setValueAtTime(523.25,t); gain.gain.setValueAtTime(0.5,t);  gain.gain.exponentialRampToValueAtTime(0.0001,t+0.5);  return 0.52; },
            end:   () => { osc.type='triangle'; osc.frequency.setValueAtTime(880,t);    gain.gain.setValueAtTime(0.5,t);  gain.gain.exponentialRampToValueAtTime(0.0001,t+1.0);  return 1.02; },
            rep:   () => { osc.type='square';   osc.frequency.setValueAtTime(440,t);    gain.gain.setValueAtTime(0.35,t); gain.gain.exponentialRampToValueAtTime(0.0001,t+0.25); return 0.27; },
            prep:  () => { osc.type='sine';     osc.frequency.setValueAtTime(660,t);    gain.gain.setValueAtTime(0.3,t);  gain.gain.exponentialRampToValueAtTime(0.0001,t+0.4);  return 0.42; },
        };
        const dur = (defs[type] || defs.start)();
        osc.start(t); osc.stop(t + dur);
    }, [ensureContext]);

    return { playSound, ensureContext };
};

// ─── Wake Lock hook ───────────────────────────────────────────────────────────

const useWakeLock = () => {
    const lockRef = useRef(null);

    const request = useCallback(async () => {
        if (!('wakeLock' in navigator)) return;
        try { lockRef.current = await navigator.wakeLock.request('screen'); }
        catch (e) { console.warn('Wake lock failed:', e.message); }
    }, []);

    const release = useCallback(() => {
        if (lockRef.current) { lockRef.current.release().catch(() => {}); lockRef.current = null; }
    }, []);

    const reacquireIfNeeded = useCallback(async (running) => {
        if (document.visibilityState === 'visible' && running) await request();
    }, [request]);

    return { requestWakeLock: request, releaseWakeLock: release, reacquireIfNeeded };
};

            React.createElement('circle', {

                stroke: meta.color, strokeWidth:"8",
                strokeDasharray: circumference,
                strokeDashoffset: circumference * (1 - progress),

                style: { transition: 'stroke-dashoffset 1s linear, stroke 0.4s ease' }

                phase === 'PREP' ? 'Relax and breathe' : `Rep ${rep} / ${totalReps}`

        )
    );
};

// ─── SetupScreen ──────────────────────────────────────────────────────────────

const SetupScreen = ({ mode, onStart, onBack, savedConfig, hasSavedSession }) => {
    const m = MODE[mode];

    const [bhMinutes,       setBhMinutes]       = useState(savedConfig?.bhMinutes       ?? 1);
    const [bhSeconds,       setBhSeconds]       = useState(savedConfig?.bhSeconds       ?? 30);
    const [recoveryMinutes, setRecoveryMinutes] = useState(savedConfig?.recoveryMinutes ?? 2);
    const [recoverySeconds, setRecoverySeconds] = useState(savedConfig?.recoverySeconds ?? 0);
    const [prepMinutes,     setPrepMinutes]     = useState(savedConfig?.prepMinutes     ?? 2);
    const [prepSeconds,     setPrepSeconds]     = useState(savedConfig?.prepSeconds     ?? 0);
    const [weeks,           setWeeks]           = useState(savedConfig?.weeks           ?? 6);
    const [selectedWeek,    setSelectedWeek]    = useState(savedConfig?.selectedWeek    ?? 1);
    const [showHistory,     setShowHistory]     = useState(false);
    const [history,         setHistory]         = useState([]);

    useEffect(() => { loadHistory().then(setHistory); }, []);

    const handleStart = () => {
        const totalBH   = bhMinutes * 60 + bhSeconds;
        const totalRec  = recoveryMinutes * 60 + recoverySeconds;
        const totalPrep = prepMinutes * 60 + prepSeconds;
        if (totalBH > 0 && totalRec > 0) {
            const config = {
                mode, breathHold: totalBH, recovery: totalRec, prepTime: totalPrep,
                weeks, selectedWeek,
                bhMinutes, bhSeconds, recoveryMinutes, recoverySeconds, prepMinutes, prepSeconds
            };
            saveData(STORE_CONFIG, { id: 'current', ...config });
            onStart(config, false);
        }
    };

    const handleResume = async () => {
        const config = await loadData(STORE_CONFIG, 'current');
        if (config) onStart(config, true);
    };

    const TimeInput = ({ label, hint, mins, secs, onMins, onSecs }) =>
        React.createElement('div', { className: `bg-gray-800 rounded-lg p-4 border ${m.accentBorder} border-opacity-40` },

                React.createElement('label', { className: "text-sm font-medium text-gray-300" }, label),
                hint && React.createElement('span', { className: "text-xs text-gray-500 italic" }, hint)
            ),
            React.createElement('div', { className: "flex items-center justify-center space-x-3" },
                React.createElement('input', { type:"number", min:"0", max:"10", value:mins, onChange:(e)=>onMins(parseInt(e.target.value)||0), className:"w-16 sm:w-20 bg-gray-700 border border-gray-600 text-white text-center text-lg rounded p-3" }),
                React.createElement('span', { className:"text-gray-400 font-medium" }, "min"),
                React.createElement('input', { type:"number", min:"0", max:"59", value:secs, onChange:(e)=>onSecs(parseInt(e.target.value)||0), className:"w-16 sm:w-20 bg-gray-700 border border-gray-600 text-white text-center text-lg rounded p-3" }),
                React.createElement('span', { className:"text-gray-400 font-medium" }, "sec")

        className: "bg-black min-h-screen min-h-[100dvh] flex flex-col items-center justify-start py-6 sm:justify-center text-white px-4 font-sans overflow-y-auto"
    },
        React.createElement('div', { className: "w-full max-w-lg mx-auto bg-gray-900/50 rounded-2xl shadow-2xl p-6 sm:p-8 border border-gray-700" },

            React.createElement('div', { className: "flex items-center mb-6" },
                React.createElement('button', { onClick: onBack, className: "text-gray-500 hover:text-white transition-colors mr-3 text-sm" }, "←"),
                React.createElement('div', { className: "flex-1 text-center" },
                    React.createElement('h1', { className: `text-3xl sm:text-4xl font-bold ${m.accentText} mb-0.5` }, m.label),
                    React.createElement('p', { className: "text-xs text-gray-500" }, m.description.split(' — ')[1] || '')
                ),
                React.createElement('div', { className: "w-6" })
            ),

            hasSavedSession && React.createElement('div', { className: `mb-5 p-4 ${m.accentBg} border ${m.accentBorder} rounded-lg` },
                React.createElement('p', { className: `${m.accentText} text-sm mb-3` }, "Saved session in progress"),
                React.createElement('button', { onClick: handleResume, className: `w-full bg-gradient-to-r ${m.accentBtn} active:opacity-80 text-white font-bold py-2.5 px-6 rounded-lg transition-all` }, "Resume Session")
            ),

            React.createElement('div', { className: "space-y-4" },
                React.createElement(TimeInput, { label:"Preparation (normal breathing)", hint:"Before table starts", mins:prepMinutes, secs:prepSeconds, onMins:setPrepMinutes, onSecs:setPrepSeconds }),
                React.createElement(TimeInput, { label:m.bhLabel,  hint:m.bhHint,  mins:bhMinutes,       secs:bhSeconds,       onMins:setBhMinutes,       onSecs:setBhSeconds }),
                React.createElement(TimeInput, { label:m.recLabel, hint:m.recHint, mins:recoveryMinutes, secs:recoverySeconds, onMins:setRecoveryMinutes, onSecs:setRecoverySeconds }),

                React.createElement('div', { className: "bg-gray-800 rounded-lg p-4 border border-gray-700" },
                    React.createElement('label', { className: "block text-sm font-medium text-gray-300 mb-3" }, "Training Program Length"),
                    React.createElement('select', { value:weeks, onChange:(e)=>setWeeks(parseInt(e.target.value)), className:"w-full bg-gray-700 border border-gray-600 text-white text-center text-lg rounded-lg p-3" },
                        [4,5,6,7,8,9,10].map(w => React.createElement('option', { key:w, value:w }, `${w} Weeks`))
                    )
                ),

                React.createElement('div', { className: "bg-gray-800 rounded-lg p-4 border border-gray-700" },
                    React.createElement('label', { className: "block text-sm font-medium text-gray-300 mb-3" }, "Start at Week"),
                    React.createElement('select', { value:selectedWeek, onChange:(e)=>setSelectedWeek(parseInt(e.target.value)), className:"w-full bg-gray-700 border border-gray-600 text-white text-center text-lg rounded-lg p-3" },
                        Array.from({ length:weeks }, (_,i) => i+1).map(w => React.createElement('option', { key:w, value:w }, `Week ${w}`))
                    )
                )
            ),

            React.createElement('button', {
                onClick: handleStart,
                className: `w-full mt-8 bg-gradient-to-r ${m.accentBtn} active:opacity-80 text-white font-bold py-4 px-8 rounded-full text-xl shadow-lg transform active:scale-95 transition-all`
            }, hasSavedSession ? "Start New Session" : "Start Training"),

            history.length > 0 && React.createElement('div', { className: "mt-6" },
                React.createElement('button', { onClick:()=>setShowHistory(!showHistory), className:"w-full text-gray-500 hover:text-gray-300 transition-colors text-sm" },
                    showHistory ? "Hide History" : "Show Training History"
                ),
                showHistory && React.createElement('div', { className: "mt-3 space-y-2 max-h-56 overflow-y-auto" },
                    history.slice(0, 15).map((s) =>
                        React.createElement('div', { key:s.id, className:"bg-gray-800/50 p-3 rounded border border-gray-700 text-xs flex items-center justify-between" },
                            React.createElement('div', null,
                                React.createElement('div', { className:"text-gray-300" }, new Date(s.timestamp).toLocaleDateString() + ' ' + new Date(s.timestamp).toLocaleTimeString()),
                                React.createElement('div', { className:"text-gray-500 mt-0.5" }, `${s.weekName} · ${s.totalReps} reps`)
                            ),
                            s.mode && React.createElement('span', { className:`text-xs px-2 py-0.5 rounded-full border ${s.mode==='o2' ? 'border-purple-700 text-purple-400' : 'border-cyan-700 text-cyan-400'}` },
                                MODE[s.mode]?.label || s.mode
                            )
                        )
                    )
                )
            ),

            React.createElement('footer', { className: "text-center mt-6 text-gray-600 text-xs" },
                "Screen stays on during training · Progress auto-saves every 2 s"
            )
        )
    );
};

// ─── TrainingScreen ───────────────────────────────────────────────────────────

const TrainingScreen = ({ config, onExit, resumeSession }) => {
    const m        = MODE[config.mode] || MODE.co2;
    const prepTime = config.prepTime ?? 120;

    const tables  = useMemo(() => m.generator(config.breathHold, config.recovery, config.weeks), [config, m]);

    const [selectedTable, setSelectedTable] = useState(resumeSession?.selectedTable || `Week ${config.selectedWeek}`);
    const tableData = tables[selectedTable] || tables[Object.keys(tables)[0]];
    const totalReps = tableData.length;

    const initPhase = resumeSession?.currentPhase    || (prepTime > 0 ? 'PREP' : 'BH');
    const initTime  = resumeSession?.timeRemaining   || (prepTime > 0 ? prepTime : tableData[0].bh);
    const initDur   = resumeSession?.initialDuration || initTime;

    const [isRunning,       setIsRunning]       = useState(false);
    const [currentRep,      setCurrentRep]      = useState(resumeSession?.currentRep || 0);
    const [currentPhase,    setCurrentPhase]    = useState(initPhase);
    const [timeRemaining,   setTimeRemaining]   = useState(initTime);
    const [initialDuration, setInitialDuration] = useState(initDur);
    const [sessionFinished, setSessionFinished] = useState(false);

    const repRef      = useRef(currentRep);
    const phaseRef    = useRef(currentPhase);
    const timeRef     = useRef(timeRemaining);
    const runningRef  = useRef(false);
    const intervalRef = useRef(null);
    const tableRef    = useRef(selectedTable);
    const firstMount  = useRef(true);

    useEffect(() => { repRef.current     = currentRep;    }, [currentRep]);
    useEffect(() => { phaseRef.current   = currentPhase;  }, [currentPhase]);
    useEffect(() => { timeRef.current    = timeRemaining; }, [timeRemaining]);
    useEffect(() => { runningRef.current = isRunning;     }, [isRunning]);
    useEffect(() => { tableRef.current   = selectedTable; }, [selectedTable]);

    const { playSound, ensureContext }                                = useAudio();
    const { requestWakeLock, releaseWakeLock, reacquireIfNeeded }     = useWakeLock();

    useEffect(() => {
        const h = () => reacquireIfNeeded(runningRef.current);
        document.addEventListener('visibilitychange', h);
        return () => document.removeEventListener('visibilitychange', h);
    }, [reacquireIfNeeded]);

    useEffect(() => () => releaseWakeLock(), [releaseWakeLock]);

    // Auto-save every 2 s
    useEffect(() => {
        const id = setInterval(() => {
            if (!sessionFinished)
                saveData(STORE_SESSION, {
                    id: 'current',
                    selectedTable: tableRef.current, currentRep: repRef.current,
                    currentPhase: phaseRef.current,  timeRemaining: timeRef.current,
                    initialDuration, timestamp: Date.now()
                });
        }, 2000);
        return () => clearInterval(id);
    }, [sessionFinished, initialDuration]);

    // Reset when week changes — skipped on first mount to preserve resume state
    useEffect(() => {
        if (firstMount.current) { firstMount.current = false; return; }
        if (!tables[selectedTable]) return;
        const sp = prepTime > 0 ? 'PREP' : 'BH';
        const st = prepTime > 0 ? prepTime : tables[selectedTable][0].bh;
        if (intervalRef.current) { clearInterval(intervalRef.current); intervalRef.current = null; }
        setIsRunning(false); runningRef.current = false;
        releaseWakeLock();
        setCurrentRep(0);    repRef.current   = 0;
        setCurrentPhase(sp); phaseRef.current = sp;
        setTimeRemaining(st); timeRef.current = st;
        setInitialDuration(st);
        setSessionFinished(false);
    }, [selectedTable, tables, prepTime, releaseWakeLock]);

    useEffect(() => () => { if (intervalRef.current) clearInterval(intervalRef.current); }, []);

    // ── Tick ──────────────────────────────────────────────────────────────────
    const tick = useCallback(() => {
        if (!runningRef.current) return;
        const next = Math.max(0, timeRef.current - 1);
        setTimeRemaining(next); timeRef.current = next;
        if (next > 0) return;

        const phase = phaseRef.current;
        const rep   = repRef.current;

        if (phase === 'PREP') {
            playSound('prep');
            const dur = tableData[0].bh;
            setCurrentPhase('BH'); phaseRef.current = 'BH';
            setInitialDuration(dur); setTimeRemaining(dur); timeRef.current = dur;

        } else if (phase === 'BH') {
            playSound('end');
            const dur = tableData[rep].rb;
            setCurrentPhase('RB'); phaseRef.current = 'RB';
            setInitialDuration(dur); setTimeRemaining(dur); timeRef.current = dur;

        } else {
            if (rep < totalReps - 1) {
                playSound('rep');
                const nr = rep + 1;
                repRef.current = nr; setCurrentRep(nr);
                const dur = tableData[nr].bh;
                setCurrentPhase('BH'); phaseRef.current = 'BH';
                setInitialDuration(dur); setTimeRemaining(dur); timeRef.current = dur;
            } else {
                playSound('end');
                setSessionFinished(true); setIsRunning(false); runningRef.current = false;
                releaseWakeLock();
                saveHistory({ mode: config.mode, weekName: tableRef.current, totalReps, completed: true });
                deleteData(STORE_SESSION, 'current');
                if (intervalRef.current) { clearInterval(intervalRef.current); intervalRef.current = null; }
            }
        }
    }, [playSound, tableData, totalReps, releaseWakeLock, config.mode]);

    useEffect(() => {
        if (isRunning && !intervalRef.current) {
            ensureContext().catch(()=>{});
            intervalRef.current = setInterval(tick, 1000);
        } else if (!isRunning && intervalRef.current) {
            clearInterval(intervalRef.current);
            intervalRef.current = null;
        }
    }, [isRunning, tick, ensureContext]);

    // ── Handlers ──────────────────────────────────────────────────────────────
    const handleStart = async () => {
        await ensureContext().catch(()=>{});
        await requestWakeLock();
        playSound('start');
        setIsRunning(true); runningRef.current = true;
        setSessionFinished(false);
    };

    const handleStop = () => {
        setIsRunning(false); runningRef.current = false;
        releaseWakeLock();
    };

    const handleReset = () => {
        if (sessionFinished) return;
        if (intervalRef.current) { clearInterval(intervalRef.current); intervalRef.current = null; }
        setIsRunning(false); runningRef.current = false;
        releaseWakeLock();
        setCurrentRep(0); repRef.current = 0;
        const sp = prepTime > 0 ? 'PREP' : 'BH';
        const st = prepTime > 0 ? prepTime : tableData[0].bh;
        setCurrentPhase(sp); phaseRef.current = sp;
        setInitialDuration(st); setTimeRemaining(st); timeRef.current = st;
        setSessionFinished(false);
        playSound('end');
    };

    // ── Derived ───────────────────────────────────────────────────────────────
    const progress = useMemo(() => {
        if (currentPhase === 'PREP') return 0;
        const total  = totalReps * 2;
        const within = initialDuration > 0 ? (initialDuration - timeRemaining) / initialDuration : 0;
        const steps  = currentRep * 2 + (currentPhase === 'BH' ? within : 1 + within);
        return Math.max(0, Math.min(1, steps / total));
    }, [currentRep, currentPhase, timeRemaining, initialDuration, totalReps]);

    return React.createElement('div', {
        className: "bg-black min-h-screen min-h-[100dvh] flex flex-col items-center justify-start py-3 sm:py-4 text-white px-3 sm:px-4 font-sans overflow-y-auto"
    },
        React.createElement('div', { className: "w-full max-w-2xl mx-auto" },

            // Header
            React.createElement('div', { className: "flex items-center justify-between mb-4" },
                React.createElement('button', { onClick: onExit, className: "text-gray-500 hover:text-white transition-colors text-sm sm:text-base" }, "← Back"),
                React.createElement('div', { className: "text-center" },
                    React.createElement('h1', { className: `text-xl sm:text-2xl font-bold ${m.accentText}` }, m.label),
                    React.createElement('p', { className: "text-gray-500 text-xs" }, selectedTable)
                ),
                isRunning
                    ? React.createElement('div', { className: "flex items-center space-x-1 text-green-400 text-xs" },
                          React.createElement('div', { className: "w-2 h-2 rounded-full bg-green-400 animate-pulse" }),
                          React.createElement('span', { className: "hidden sm:inline" }, "Screen on")
                      )
                    : React.createElement('div', { className: "w-16" })
            ),

            // Timer circle
            React.createElement(TimerDisplay, { time:timeRemaining, phase:currentPhase, rep:currentRep+1, totalReps, initialDuration }),

            // Progress bar
            React.createElement('div', { className: "my-4 px-2" },
                React.createElement('div', { className: "flex items-center justify-between mb-2 text-xs sm:text-sm text-gray-500" },
                    React.createElement('span', null, currentPhase === 'PREP' ? 'Preparing…' : 'Session Progress'),
                    React.createElement('span', null, `${Math.round(progress * 100)}%`)
                ),
                React.createElement('div', { className: "w-full h-3 bg-gray-800 rounded-full overflow-hidden border border-gray-700" },
                    React.createElement('div', {
                        className: "h-full rounded-full transition-all duration-500 ease-linear",
                        style: { width:`${progress*100}%`, background:'linear-gradient(90deg,#06b6d4,#10b981)' }
                    })
                )
            ),

            // Week selector
            React.createElement('div', { className: "my-4" },
                React.createElement('label', { htmlFor:"week-select", className:"block text-sm font-medium text-gray-400 mb-2 text-center" }, "Change Week"),
                React.createElement('select', {
                    id:"week-select", value:selectedTable,
                    onChange:(e)=>setSelectedTable(e.target.value),
                    disabled:isRunning,
                    className:"block w-full max-w-xs mx-auto bg-gray-800 border border-gray-700 text-white text-base sm:text-lg rounded-lg p-2 sm:p-3 disabled:opacity-50"
                }, Object.keys(tables).map(n => React.createElement('option', { key:n, value:n }, n)))
            ),

            // Controls
            React.createElement('div', { className: "flex justify-center items-center space-x-3 sm:space-x-4 my-5" },
                !isRunning
                    ? React.createElement('button', { onClick:handleStart, className:"bg-green-500 hover:bg-green-600 active:bg-green-700 text-white font-bold py-3 px-8 sm:py-4 sm:px-10 rounded-full text-xl sm:text-2xl shadow-lg transform active:scale-95 transition-all" }, "Start")
                    : React.createElement('button', { onClick:handleStop,  className:"bg-red-500   hover:bg-red-600   active:bg-red-700   text-white font-bold py-3 px-8 sm:py-4 sm:px-10 rounded-full text-xl sm:text-2xl shadow-lg transform active:scale-95 transition-all" }, "Stop"),
                React.createElement('button', {
                    onClick:handleReset, disabled:sessionFinished,
                    className:"font-bold py-3 px-8 sm:py-4 sm:px-10 rounded-full text-xl sm:text-2xl shadow-lg transition-all " +
                        (sessionFinished ? "bg-gray-700 text-gray-500 cursor-not-allowed" : "bg-gray-600 hover:bg-gray-500 active:bg-gray-700 transform active:scale-95")
                }, "Reset")
            ),

            // Completion banner
            sessionFinished && React.createElement('div', { className: "my-4 p-4 bg-green-900/30 border border-green-700 rounded-lg text-center" },
                React.createElement('p', { className: "text-green-300 text-lg font-semibold" }, "🎉 Session Complete!"),
                React.createElement('p', { className: "text-green-400 text-sm mt-2" }, "Great work! Your progress has been saved.")
            ),

            // Rep schedule table
            React.createElement('div', { className: "mt-4 mb-4" },
                React.createElement('div', { className: "flex items-center justify-between mb-3 px-1" },
                    React.createElement('h2', { className: "text-sm font-medium text-gray-500" }, "Week Schedule"),
                    React.createElement('span', { className: `text-xs ${m.accentText}` },
                        config.mode === 'co2' ? 'Fixed hold · ↓ recovery' : '↑ hold · Fixed recovery'
                    )
                ),
                React.createElement('div', { className: "overflow-x-auto rounded-lg border border-gray-800" },
                    React.createElement('table', { className: "w-full text-xs sm:text-sm border-collapse" },
                        React.createElement('thead', { className: "bg-gray-800/60" },
                            React.createElement('tr', null,
                                React.createElement('th', { className: "text-gray-500 font-medium py-2 text-left pl-3" }, "Rep"),
                                React.createElement('th', { className: "text-cyan-600  font-medium py-2 text-center" }, "Hold"),
                                React.createElement('th', { className: "text-orange-600 font-medium py-2 text-center" }, "Recovery")
                            )
                        ),
                        React.createElement('tbody', null,
                            tableData.map((row, i) =>
                                React.createElement('tr', {
                                    key: i,
                                    className: "border-t border-gray-800/60 " + (i === currentRep && currentPhase !== 'PREP' && !sessionFinished ? 'bg-gray-800/50' : '')
                                },
                                    React.createElement('td', { className: "py-2 pl-3 text-gray-400" },
                                        i === currentRep && currentPhase !== 'PREP' && !sessionFinished
                                            ? React.createElement('span', { className: "inline-block w-1.5 h-1.5 rounded-full bg-cyan-400 mr-2 align-middle" })
                                            : null,
                                        `#${i+1}`
                                    ),
                                    React.createElement('td', { className: "py-2 text-center text-cyan-300 font-mono"   }, formatTime(row.bh)),
                                    React.createElement('td', { className: "py-2 text-center text-orange-300 font-mono" }, formatTime(row.rb))
                                )
                            )
                        )
                    )
                )
            ),

            React.createElement('footer', { className: "text-center mt-2 mb-8 text-gray-600 text-xs space-y-1" },
                React.createElement('p', null, "Hold your breath during BREATH HOLD."),
                React.createElement('p', null, "Breathe normally during RECOVERY and Preparation."),
                React.createElement('p', { className: `mt-1 ${m.accentText}` }, "Progress auto-saves every 2 seconds.")
            )
        )
    );
};

// ─── App ──────────────────────────────────────────────────────────────────────

const App = () => {
    const [screen,          setScreen]          = useState('select');
    const [mode,            setMode]            = useState(null);
    const [trainingConfig,  setTrainingConfig]  = useState(null);
    const [savedConfig,     setSavedConfig]     = useState(null);
    const [savedSession,    setSavedSession]    = useState(null);
    const [hasSavedSession, setHasSavedSession] = useState(false);
    const [loading,         setLoading]         = useState(true);

    useEffect(() => {
        (async () => {
            try {
                const [cfg, ses] = await Promise.all([
                    loadData(STORE_CONFIG,  'current'),
                    loadData(STORE_SESSION, 'current')
                ]);
                if (cfg) setSavedConfig(cfg);
                if (ses?.timestamp && Date.now() - ses.timestamp < 86_400_000) {
                    setSavedSession(ses);
                    setHasSavedSession(true);
                }
            } finally { setLoading(false); }
        })();
    }, []);

    const handleSelectMode = useCallback((selectedMode) => {
        setMode(selectedMode);
        setScreen('setup');
    }, []);

    const handleStartTraining = useCallback((config, resume = false) => {
        setTrainingConfig(config);
        if (!resume) { setSavedSession(null); deleteData(STORE_SESSION, 'current'); }
        setScreen('training');
    }, []);

    const handleResume = useCallback(async () => {
        const config = await loadData(STORE_CONFIG, 'current');
        if (config) { setTrainingConfig(config); setScreen('training'); }
    }, []);

    const handleExitToSelect = useCallback(async () => {
        setScreen('select');
        const ses = await loadData(STORE_SESSION, 'current');
        if (ses?.timestamp && Date.now() - ses.timestamp < 86_400_000) {
            setSavedSession(ses);
            const cfg = await loadData(STORE_CONFIG, 'current');
            if (cfg) setSavedConfig(cfg);
            setHasSavedSession(true);
        } else {
            setSavedSession(null);
            setHasSavedSession(false);
        }
    }, []);

    if (loading) return React.createElement('div', {
        className: "bg-black min-h-screen min-h-[100dvh] flex items-center justify-center text-white"
    },
        React.createElement('div', { className: "text-center" },
            React.createElement('div', { className: "w-12 h-12 rounded-full border-4 border-gray-700 border-t-cyan-400 animate-spin mx-auto mb-4" }),
            React.createElement('p', { className: "text-gray-500 text-lg" }, "Loading…")
        )
    );

    if (screen === 'training' && trainingConfig)
        return React.createElement(TrainingScreen, { config:trainingConfig, onExit:handleExitToSelect, resumeSession:savedSession });

    if (screen === 'setup' && mode)
        return React.createElement(SetupScreen, {
            mode, onStart:handleStartTraining, onBack:()=>setScreen('select'),
            savedConfig: savedConfig?.mode === mode ? savedConfig : null,
            hasSavedSession: hasSavedSession && savedConfig?.mode === mode
        });

    return React.createElement(TypeSelectionScreen, {
        onSelectMode: handleSelectMode,
        hasSavedSession, savedConfig,
        onResume: handleResume
    });
};

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
